name: amplifier-agent-typescript-checkout

x-dtu:
  description: TypeScript binding built from the release tag, served from the local checkout
  twin_machine: twin
  repositories:
    - path: ../../../.snapshot/amplifier-agent
      url: https://github.com/microsoft/amplifier-agent

services:
  twin:
    command: ["/opt/setup/install.sh", "build"]
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      COPILOT_AGENT_TOKEN: ${COPILOT_AGENT_TOKEN:-}
      COPILOT_GITHUB_TOKEN: ${COPILOT_GITHUB_TOKEN:-}
      GH_TOKEN: ${GH_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    healthcheck:
      test: ["CMD", "test", "-f", "/home/agent/app/.setup-status"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 1800s
