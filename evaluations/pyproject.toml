[project]
name = "amplifier-agent-evaluations"
version = "0.1.0"
description = "Live capability evaluations of amplifier-agent v1 in isolated containers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dtu-lite @ git+https://github.com/DavidKoleczek/amplifier-smart-tool-dtu-lite@9238c716365452372b14bda46821e48539c4fe60",
    "amplifier-agent-grader",
    "pyyaml>=6.0,<7.0",
    "typer>=0.27.2,<0.28.0",
]

[project.scripts]
amplifier-agent-evaluations = "amplifier_agent_evaluations.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "amplifier_agent_evaluations"

[tool.uv]
add-bounds = "major"
default-groups = "all"

[tool.uv.sources]
amplifier-agent-grader = { path = "grader", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
    "ty>=0.0.79",
]

[tool.ruff]
line-length = 120
target-version = "py313"
# Task workspaces and grader data are fixtures the agent under test and the grader read as they are.
extend-exclude = ["tasks"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "RUF",  # ruff
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "ISC",  # flake8-implicit-str-concat
    "PIE",  # flake8-pie
    "PT",   # flake-pytest-style
    "PTH",  # flake8-use-pathlib
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
]
ignore = [
    "E501",   # line-too-long (formatter makes best-effort attempt)
    # The following rules conflict with the formatter, see: https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",   # tab-indentation
    "E111",   # indentation-with-invalid-multiple
    "E114",   # indentation-with-invalid-multiple-comment
    "E117",   # over-indented
    "ISC002", # multi-line-implicit-string-concatenation
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
split-on-trailing-comma = false

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ty.src]
exclude = ["tasks"]

[tool.pytest.ini_options]
testpaths = ["tests", "grader/tests"]
