name: smoke-typescript-checkout
description: The TypeScript hello task against the local working tree.
install: checkout
agent:
  provider: openai
  model: gpt-6.1-sol
tasks:
  include: [typescript/hello]
  exclude: []
trials: 1
parallel: 2
timeouts:
  launch_seconds: 1800
  task_seconds: 120
grader:
  provider: openai
  model: gpt-6.1-sol
output: evaluations/output
