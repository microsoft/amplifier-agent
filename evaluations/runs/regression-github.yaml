name: regression-github
description: Every capability task against microsoft/amplifier-agent v1 on GitHub.
install: github
agent:
  provider: openai
  model: gpt-6-sol
tasks:
  include: ["*"]
  exclude: []
trials: 1
parallel: 8
timeouts:
  launch_seconds: 900
  task_seconds: 300
grader:
  provider: openai
  model: gpt-6-sol
output: evaluations/output
