name: smoke-http-checkout
description: The HTTP face tasks that need only OpenAI credentials, against the local working tree.
install: checkout
agent:
  provider: openai
  model: gpt-6.1-sol
tasks:
  include: ["http/hello", "http/image", "http/streaming"]
  exclude: []
trials: 1
parallel: 2
timeouts:
  launch_seconds: 900
  task_seconds: 120
grader:
  provider: openai
  model: gpt-6.1-sol
output: evaluations/output
