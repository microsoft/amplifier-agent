name: smoke-acp-checkout
description: The ACP face tasks, against the local working tree.
install: checkout
agent:
  provider: openai
  model: gpt-6.1-sol
tasks:
  include: ["acp/hello", "acp/edit_approval", "acp/deny", "acp/cancel", "acp/load", "acp/model_switch"]
  exclude: []
trials: 1
parallel: 2
timeouts:
  launch_seconds: 900
  task_seconds: 120
grader:
  provider: openai
  model: gpt-6.1-sol
output: evaluations/output
