pass_score: 1.0
evaluations:
  - name: working_directory
    weight: 1
    steps: |
      What this checks: an agent given working_directory, additional_directories and environment works where it was
      told and nowhere else. The driver runs in /workspace and passes working_directory "project", so the agent's
      working directory is /workspace/project. A relative write lands there, bash runs there and sees EVAL_MARK, a
      write to the additional directory /home/agent/shared succeeds, a write to /home/agent/outside.txt is refused,
      the durable session is kept in the default sessions directory for /workspace/project, and the driver process's
      own cwd and environment are unchanged. driver/footprint.txt lists every file the task wrote in the container.
      1. The nonce is in task.json: agent_options.environment.EVAL_MARK, and session.session_id is wd-<nonce>.
      2. Read the turn's outcome from driver/result.json: state, content (the reply), error, driver_error, and
         segments[0].process (cwd, environment_leaked). A driver_error naming working_directory,
         additional_directories or environment as unexpected means the agent was never created.
      3. List the tool calls and results with the calls and results projections (EVENTS). Match each tool_result to
         its tool_call by call_id. For bash, meta holds stdout, stderr and returncode. For write_file, the path is in
         the call's arguments, and the result's outcome, error and head show whether it was refused.
      4. List the footprint entries outside the three allowed locations:
         rg -v '^(/workspace/project/|/home/agent/shared/|/home/agent/\.amplifier-agent/projects/-workspace-project/)' /home/agent/app/out/footprint.txt
         Also run wc -l on it.
      5. Check the files: ls -la /workspace /workspace/project /home/agent/shared; test -e /home/agent/outside.txt
         && echo present || echo absent; cat /workspace/project/notes.md.
      6. Check the sessions directory: ls /home/agent/.amplifier-agent/projects/, then
         rg -c <nonce> /home/agent/.amplifier-agent/projects/-workspace-project/sessions/wd-<nonce>/transcript.jsonl
      If the turn has no terminal event (the agent was never created), every criterion scores 0 and the reasons
      quote driver_error.
    rubric:
      footprint_contained:
        points: 15
        description: >-
          Every file the task wrote is in the working directory, the additional directory, or the default sessions
          directory. Evidence: driver/footprint.txt exists, the turn has a terminal event, and every entry is under
          /workspace/project/, /home/agent/shared/, or /home/agent/.amplifier-agent/projects/-workspace-project/
          (step 4 prints nothing). All or nothing: 0 otherwise; list the offending paths.
      relative_write_in_working_dir:
        points: 10
        description: >-
          A relative path resolved against the working directory. Evidence: /workspace/project/notes.md exists and
          /workspace/notes.md does not. All or nothing.
      bash_cwd:
        points: 15
        description: >-
          bash ran in the working directory. Evidence: the bash tool_result for the pwd call has stdout
          /workspace/project (ignoring a trailing newline). All or nothing: 0 when there is no pwd call or its
          output differs; quote it.
      environment_reaches_bash:
        points: 10
        description: >-
          The environment entry reached bash. Evidence: the bash tool_result for the echo "$EVAL_MARK" call has
          stdout containing the nonce. All or nothing: 0 when there is no such call or the nonce is absent; quote the
          output.
      additional_dir_write:
        points: 10
        description: >-
          A write to the additional directory succeeded. Evidence: /home/agent/shared/shared.md exists, and a
          write_file tool_call with that path has a tool_result with outcome completed. All or nothing: 0 when the
          file is missing or was created by another tool such as bash.
      outside_write_refused:
        points: 10
        description: >-
          A write outside the working directory and the additional directory was refused, and the agent said so.
          Evidence: the write_file tool_result for /home/agent/outside.txt is an error (outcome failed, or content
          reporting the write was refused), /home/agent/outside.txt is absent, and the reply says that write was
          refused or failed. All or nothing: 0 when the write succeeded, the file exists, there is no such call, or
          the reply claims it worked.
      sessions_default_slug:
        points: 15
        description: >-
          The durable session went to the default sessions directory computed from the working directory.
          Evidence: /home/agent/.amplifier-agent/projects/-workspace-project/sessions/wd-<nonce>/transcript.jsonl
          exists and contains the nonce at least once. All or nothing: 0 when it is missing (for example, it is under
          projects/-workspace/ instead); state what step 6 listed.
      process_unchanged:
        points: 10
        description: >-
          The agent did not change the driver process's cwd or environment. Evidence: the turn has a terminal event,
          and segments[0].process.cwd in driver/result.json is /workspace and segments[0].process.environment_leaked
          is an empty list. All or nothing: 0 when process is missing or either value differs; state them.
      turn_success:
        points: 5
        description: >-
          The turn finished cleanly. Evidence: the turn's state is "success" with error null and driver_error is
          null. All or nothing: 0 otherwise; the reason quotes the error.
