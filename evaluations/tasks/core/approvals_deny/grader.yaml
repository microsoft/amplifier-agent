pass_score: 1.0
evaluations:
  - name: approvals_deny
    weight: 1
    steps: |
      What this checks: a denied approval really stops the tool and returns to the model. Each write_file request goes
      through the approval channel carrying the exact arguments, the decision is deny, the tool never runs, nothing
      lands on disk, the model receives a tool result with error.code approval_denied, and the turn continues to state
      success with a reply that tells the user the file was not written.
      1. Read the turn's outcome from result.json: state, content, error {code, message, remedy} and driver_error.
      2. Follow every write_file call through the events: the tool_call, the approval_request for it
         (payload.request.call_id equals the call's call_id), the approval_decision for that request
         (payload.resolution.request_id equals the request's request_id), and the tool_result (same call_id).
      3. Compare each approval_request's payload.request.arguments with its tool_call's payload.call.arguments.
      4. Check that /workspace/hello.txt does not exist.
      If the agent never made a write_file tool_call, nothing was tested: every criterion scores 0.
    rubric:
      approval_requested:
        points: 15
        description: >-
          Each tool call was routed through approvals with its exact arguments. Evidence: for every write_file
          tool_call, an approval_request whose payload.request.call_id equals its call_id and whose
          payload.request.arguments equals its payload.call.arguments exactly. All or nothing.
      denied:
        points: 15
        description: >-
          The deny policy produced a deny decision. Evidence: every approval_decision for those requests has decision
          "deny". All or nothing.
      tool_not_run:
        points: 20
        description: >-
          The denied tool did not execute, and the model was told why. Evidence: every write_file tool_result has
          outcome "cancelled" and error.code "approval_denied". All or nothing.
      no_effect:
        points: 20
        description: >-
          The denial had no side effect. Evidence: workspace/hello.txt does not exist. All or nothing; zero if the
          file exists or if no write_file call was attempted.
      turn_continued:
        points: 30
        description: >-
          The denial did not end the turn. Evidence: state "success" with no error in both driver/result.json and the
          terminal event, at least one tool_result precedes the terminal, and the reply content says the file was not
          created or that writing was denied. All or nothing; quote the actual state and the relevant reply text.
