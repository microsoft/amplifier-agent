pass_score: 1.0
evaluations:
  - name: approvals_deny
    weight: 1
    steps: |
      What this checks: a denied approval really stops the tool. The write_file request goes through the approval
      channel, the decision is deny, the tool never runs, nothing lands on disk, and the turn reports that outcome
      as state rejected with error.code approval_denied.
      1. Read the turn's outcome from result.json: state, content, error {code, message, remedy} and driver_error.
      2. Follow the one write_file call through the events: the tool_call, the approval_request for it
         (payload.request.call_id equals the call's call_id), the approval_decision for that request
         (payload.resolution.request_id equals the request's request_id), and the tool_result (same call_id).
      3. Check that /workspace/hello.txt does not exist.
      If the agent never made a write_file tool_call, nothing was tested: every criterion scores 0.
    rubric:
      approval_requested:
        points: 20
        description: >-
          The tool call was routed through approvals. Evidence: an approval_request whose payload.request.call_id
          equals the write_file tool_call's call_id. All or nothing.
      denied:
        points: 25
        description: >-
          The deny policy produced a deny decision. Evidence: the approval_decision for that request_id has decision
          "deny". All or nothing.
      tool_not_run:
        points: 10
        description: >-
          The denied tool did not execute. Evidence: the write_file tool_result has an outcome other than
          "completed" (for example "cancelled" with error.code approval_denied). All or nothing.
      no_effect:
        points: 20
        description: >-
          The denial had no side effect. Evidence: workspace/hello.txt does not exist. All or nothing; zero if the
          file exists or if no write_file call was attempted.
      terminal_rejected:
        points: 25
        description: >-
          The turn reports the denial as its documented outcome. Evidence: state "rejected" and error.code
          "approval_denied" in both driver/result.json and the terminal event. All or nothing; quote the actual state
          and code.
