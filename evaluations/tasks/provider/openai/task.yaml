name: provider-openai
description: Provider check for OpenAI. The agent answers a plain turn with no tools, then runs a single bash tool call, with usage attributed to openai/gpt-6-sol.
agent:
  provider: openai
  model: gpt-6-sol
requires_env: [OPENAI_API_KEY]
tools: [bash]
approvals: allow
skills: []
host: null
session:
  persistence: ephemeral
turns:
  - user: "Reply with exactly the word ready. Do not use any tools."
  - user: "Use the bash tool to run exactly this command: echo {{nonce}}   Then reply with only the command's output."
