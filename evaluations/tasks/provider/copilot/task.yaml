name: provider-copilot
description: Provider check for GitHub Copilot. The agent answers a plain turn with no tools, then runs a single bash tool call, with usage attributed to github-copilot/gpt-6-sol.
agent:
  provider: github-copilot
  model: gpt-6-sol
requires_env: [[COPILOT_AGENT_TOKEN, COPILOT_GITHUB_TOKEN, GH_TOKEN, GITHUB_TOKEN]]
tools: [bash]
approvals: allow
skills: []
host: null
session:
  persistence: ephemeral
turns:
  - user: "Reply with exactly the word ready. Do not use any tools."
  - user: "Use the bash tool to run exactly this command: echo {{nonce}}   Then reply with only the command's output."
