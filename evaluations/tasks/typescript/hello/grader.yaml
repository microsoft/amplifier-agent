pass_score: 1.0
evaluations:
  - name: reply
    weight: 1
    steps: |
      What this checks: the simplest possible turn works end to end through the TypeScript binding. The Node driver
      runs the turn through amplifier-agent-ts, the model answers with the one word it was asked for, the
      turn closes cleanly with a single terminal event, and that terminal event carries real token counts.
      1. Read driver/env.json: node (the Node version), amplifier_agent (the package version) and
         contract_versions.
      2. Read the turn's outcome from result.json: state, error, content (the joined reply text), usage.entries[]
         and driver_error.
      3. Read the terminal event(s): payload.state and payload.usage.entries[] (tokens_in, tokens_out). Early usage
         events with null tokens are normal; only the terminal usage is judged.
      4. Read the turn_started event's payload.reasoning_effort with the turns command.
    rubric:
      exact_reply:
        points: 35
        description: >-
          The model answered with exactly the requested word. Evidence: the turn's content is the word "ready",
          ignoring surrounding whitespace, letter case and one trailing period ("ready", "Ready", " ready.\n" all earn
          full credit). All or nothing: 0 for any other or additional words, quotes around the word, or empty content.
      terminal_usage_tokens:
        points: 25
        description: >-
          Token usage was reported for the turn. Evidence: the terminal event's payload.usage has at least one entry
          whose tokens_in and tokens_out are both integers greater than 0 (the turn in driver/result.json carries the
          same usage). All or nothing: 0 if there is no terminal event, no usage entries, or either count is null, 0
          or missing. The cost field is not judged.
      turn_success:
        points: 20
        description: >-
          The turn finished cleanly. Evidence: state "success" with error null in driver/result.json, and
          driver_error null. All or nothing.
      single_terminal:
        points: 10
        description: >-
          The turn ended exactly once. Evidence: driver/events.jsonl holds exactly one terminal event and its
          payload.state is "success". All or nothing: 0 for zero or more than one terminal event, or a different
          state.
      typescript_binding:
        points: 10
        description: >-
          The turn ran through the TypeScript binding. Evidence: driver/env.json has a non-empty node version, a
          non-empty amplifier_agent version, and contract_versions containing "turn-events/1". All or nothing: 0 if
          env.json is missing, node is absent, or either other field is missing.
      reasoning_effort_reported:
        points: 10
        description: >-
          Primary work ran at the reasoning effort the task asked for. Evidence: the turn_started event's
          payload.reasoning_effort equals task.json agent_options.reasoning_effort ("low"). All or nothing: 0 if
          there is no turn_started event, or its reasoning_effort is absent or a different value.
