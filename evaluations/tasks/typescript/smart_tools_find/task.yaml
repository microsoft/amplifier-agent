name: smart_tools_find
description: TypeScript binding smart tools, on by default. The Node driver sets no smartTools option, so the agent has
  the amplifier-smart-tools skill and a smart tools section in its system prompt. Asked to find a smart tool that
  checks a web app the way a real user would, without installing anything, it loads the amplifier-smart-tools skill,
  reads the Smart Tools catalog, and names reality-check, with no install command run.
surface: typescript
tools: [bash, read_file, web_fetch]
approvals: allow
skills: []
host: null
env:
  AMPLIFIER_AGENT_ENGINE_RAW_LLM_PAYLOADS: "1"
session:
  persistence: ephemeral
turns:
  - user: "I want to check that my web app works the way a real user would experience it. Find a smart tool that can
      do this. Do not install anything. Reply with the tool's name as it is listed in the smart tools catalog, and one
      sentence on why it fits."
