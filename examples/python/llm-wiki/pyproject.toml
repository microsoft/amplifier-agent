[project]
name = "llm-wiki"
version = "0.1.0"
description = "Build and maintain an LLM wiki of the Amplifier ecosystem with amplifier-agent"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "amplifier-agent",
    "pyyaml>=6.0,<7.0",
]

[project.scripts]
llm-wiki = "llm_wiki.__main__:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "llm_wiki"
module-root = ""

[tool.uv.sources]
amplifier-agent = { git = "https://github.com/microsoft/amplifier-agent", subdirectory = "packages/python", rev = "9bed1c7d0ea6fe8ef27cf2d25e364e1dfda3efca" }

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
    "ty>=0.0.79",
]

[tool.uv]
add-bounds = "major"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["raw", "wiki", ".state"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "RUF",  # ruff
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "ISC",  # flake8-implicit-str-concat
    "PIE",  # flake8-pie
    "PT",   # flake-pytest-style
    "PTH",  # flake8-use-pathlib
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
]
ignore = [
    "E501",   # line-too-long (formatter makes best-effort attempt)
    # The following rules conflict with the formatter, see: https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",   # tab-indentation
    "E111",   # indentation-with-invalid-multiple
    "E114",   # indentation-with-invalid-multiple-comment
    "E117",   # over-indented
    "ISC002", # multi-line-implicit-string-concatenation
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
split-on-trailing-comma = false

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = ["raw", "wiki", ".state"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
