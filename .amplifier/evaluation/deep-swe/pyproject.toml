[project]
name = "deepswe-agents"
version = "0.1.0"
description = "Amplifier agent adapters for the deep-swe benchmark (run via the pier CLI)"
requires-python = ">=3.11"
# Intentionally empty. This package is installed with `uv pip install -e .` INTO
# pier's own venv, which already provides `pier`; declaring it here would try to
# resolve a tool that is installed separately. pytest is a dev-only need.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepswe_agents"]

[tool.ruff]
line-length = 100
