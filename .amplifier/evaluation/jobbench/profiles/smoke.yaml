name: jobbench-smoke
description: >
  Minimal Ubuntu 24.04 DTU for exercising the harness's DTU layer end to end
  (exec, file-push, file-pull) without any task-specific provisioning.

base:
  image: ubuntu:24.04

passthrough:
  allow_external: true

provision:
  setup_cmds:
    - mkdir -p /workspace

readiness:
  - name: workspace-exists
    command: "test -d /workspace && echo OK"
