[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "amplifier-agent-engine"
version = "0.30.1"
description = "Private execution engine for Amplifier Agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.15"
dependencies = [
  "amplifier-core>=2.0.1,<3.0.0",
  "amplifier-module-loop-streaming @ git+https://github.com/microsoft/amplifier-module-loop-streaming",
  "amplifier-module-context-simple @ git+https://github.com/microsoft/amplifier-module-context-simple",
  "amplifier-module-provider-anthropic @ git+https://github.com/microsoft/amplifier-module-provider-anthropic",
  "amplifier-module-provider-openai @ git+https://github.com/microsoft/amplifier-module-provider-openai",
  "amplifier-module-provider-azure-openai @ git+https://github.com/microsoft/amplifier-module-provider-azure-openai",
  "amplifier-module-provider-ollama @ git+https://github.com/microsoft/amplifier-module-provider-ollama",
  "amplifier-module-provider-openai-chatgpt @ git+https://github.com/microsoft/amplifier-module-provider-openai-chatgpt",
  "amplifier-module-provider-chat-completions @ git+https://github.com/microsoft/amplifier-module-provider-chat-completions",
  "amplifier-module-provider-gemini @ git+https://github.com/microsoft/amplifier-module-provider-gemini",
  "amplifier-module-provider-vllm @ git+https://github.com/microsoft/amplifier-module-provider-vllm",
  "amplifier-foundation @ git+https://github.com/microsoft/amplifier-foundation",
  "amplifier-module-tool-delegate @ git+https://github.com/microsoft/amplifier-foundation#subdirectory=modules/tool-delegate",
  "amplifier-module-tool-skills @ git+https://github.com/microsoft/amplifier-bundle-skills#subdirectory=modules/tool-skills",
  "amplifier-module-tool-mcp @ git+https://github.com/microsoft/amplifier-module-tool-mcp",
  "amplifier-module-tool-filesystem @ git+https://github.com/microsoft/amplifier-module-tool-filesystem",
  "amplifier-module-tool-apply-patch @ git+https://github.com/microsoft/amplifier-bundle-filesystem#subdirectory=modules/tool-apply-patch",
  "amplifier-module-tool-bash @ git+https://github.com/microsoft/amplifier-module-tool-bash",
  "amplifier-module-tool-web @ git+https://github.com/microsoft/amplifier-module-tool-web",
  "amplifier-module-tool-search @ git+https://github.com/microsoft/amplifier-module-tool-search",
  "amplifier-module-hooks-routing @ git+https://github.com/microsoft/amplifier-bundle-routing-matrix#subdirectory=modules/hooks-routing",
  "amplifier-module-hook-context-intelligence @ git+https://github.com/microsoft/amplifier-bundle-context-intelligence#subdirectory=modules/hook-context-intelligence",
  "amplifier-module-hook-redaction @ git+https://github.com/microsoft/amplifier-bundle-redaction#subdirectory=modules/hook-redaction",
  "jsonschema>=4.20.0,<5.0.0",
  "certifi>=2026.10.23,<2027.0.0",
]

[project.optional-dependencies]
github-copilot = [
  "amplifier-module-provider-github-copilot @ git+https://github.com/microsoft/amplifier-module-provider-github-copilot",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/amplifier_agent_engine"]

[tool.hatch.build.targets.sdist]
include = ["src", "pyproject.toml", "README.md", "LICENSE"]
