[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "amplifier-agent-engine"
version = "1.0.0a1"
description = "Private execution engine for Amplifier Agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "amplifier-core==1.6.1",
  "amplifier-module-loop-streaming @ git+https://github.com/microsoft/amplifier-module-loop-streaming@cda31dc63e99d40627a2883fdd722a46521c4521",
  "amplifier-module-context-simple @ git+https://github.com/microsoft/amplifier-module-context-simple@f2dbde9719379449e199c261321bb27fb9c34564",
  "amplifier-module-provider-anthropic @ git+https://github.com/microsoft/amplifier-module-provider-anthropic@fee22b0c35bc99e1a542bde7c6268a1cf673371e",
  "amplifier-module-provider-openai @ git+https://github.com/microsoft/amplifier-module-provider-openai@7a8da741411d2af87461d7793f4302316342a48c",
  "amplifier-module-provider-azure-openai @ git+https://github.com/microsoft/amplifier-module-provider-azure-openai@d4bad23475435f8daee334fbec470095ef71f379",
  "amplifier-module-provider-ollama @ git+https://github.com/microsoft/amplifier-module-provider-ollama@add42028769d074ebf5aaebaa197112e382ab2d1",
  "amplifier-module-provider-github-copilot @ git+https://github.com/microsoft/amplifier-module-provider-github-copilot@bc8d6a98f134ec464d669dc0b4284091957fb699",
  "amplifier-module-provider-openai-chatgpt @ git+https://github.com/microsoft/amplifier-module-provider-openai-chatgpt@711d9ae7ecb9917755b2868854e4ec3a88c281d1",
  "amplifier-module-provider-chat-completions @ git+https://github.com/microsoft/amplifier-module-provider-chat-completions@4ecdd9bcf6f90cf6958a6b79cf325de7bcc5b031",
  "amplifier-module-provider-gemini @ git+https://github.com/microsoft/amplifier-module-provider-gemini@a7c5e0ceb11251499009d77b7993b9bbb375be48",
  "amplifier-module-provider-vllm @ git+https://github.com/microsoft/amplifier-module-provider-vllm@30d6106fbb463f0848dcde3a415af9aa4d2b2cbe",
  "amplifier-foundation @ git+https://github.com/microsoft/amplifier-foundation@7ca50a8adb7e1d7b60318b97259e860625a6aded",
  "amplifier-module-tool-delegate @ git+https://github.com/microsoft/amplifier-foundation@7ca50a8adb7e1d7b60318b97259e860625a6aded#subdirectory=modules/tool-delegate",
  "amplifier-module-tool-skills @ git+https://github.com/microsoft/amplifier-bundle-skills@28c5c00c678b2b01e906b207ec8184a207cbc444#subdirectory=modules/tool-skills",
  "amplifier-module-tool-mcp @ git+https://github.com/microsoft/amplifier-module-tool-mcp@1229a364557fd17d95ad31d6805e1a013287b951",
  "amplifier-module-tool-filesystem @ git+https://github.com/microsoft/amplifier-module-tool-filesystem@aeadf4e3d1e2308415166ebccdad7fda17d6db04",
  "amplifier-module-tool-bash @ git+https://github.com/microsoft/amplifier-module-tool-bash@4c1365cc4d4bd4371c3579a998c7cfd1156e881a",
  "amplifier-module-tool-web @ git+https://github.com/microsoft/amplifier-module-tool-web@8bd784e2dca412d5c3eb9a1fa1ffa2b3e7131498",
  "amplifier-module-tool-search @ git+https://github.com/microsoft/amplifier-module-tool-search@0c7f4a7ca825e90203e858abac9d9a3d5c3abbf1",
  "amplifier-module-hooks-routing @ git+https://github.com/microsoft/amplifier-bundle-routing-matrix@26908f1ce0f455ca91f272bbb34fdae2399ac1b6#subdirectory=modules/hooks-routing",
  "jsonschema>=4.25,<5",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/amplifier_agent_engine"]

[tool.hatch.build.targets.sdist]
include = ["src", "pyproject.toml", "README.md", "LICENSE"]
