[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "amplifier-agent"
version = "1.0.0a1"
description = "Python binding for Amplifier Agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "amplifier-agent-engine @ git+https://github.com/microsoft/amplifier-agent@v1#subdirectory=packages/engine",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/amplifier_agent"]

[tool.hatch.build.targets.sdist]
include = ["src", "pyproject.toml", "README.md", "LICENSE"]
