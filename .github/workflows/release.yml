name: Release

# A v<X.Y.Z> tag builds the Python distributions and the TypeScript package archive,
# attaches them to a GitHub Release, then runs publish-wrapper.yml to publish the archive to npm.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04 # The runtime links against this glibc (2.35), the documented minimum.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-node@54337e0d02de9202d0948aaff36ad556375497b9
        with:
          node-version: "22.23.2"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@c84232ca4fde9b022e20a930bfbbecd386b56fdf
        with:
          version: "0.12.9"
          python-version: "3.12.14"
          cache-dependency-glob: uv.lock
      - name: Check the tag matches the release version
        run: python3 scripts/release_version.py check --tag "$GITHUB_REF_NAME"
      - name: Install locked dependencies
        run: |
          npm install --global npm@12.0.2
          npm install --global pnpm@11.25.0
          (cd packages/typescript && pnpm install --frozen-lockfile)
      - name: Build Python distributions
        run: uv build --all-packages --no-sources --out-dir dist
      - name: Build the TypeScript runtime
        run: uv run --frozen --package amplifier-agent-engine --extra github-copilot --group build python scripts/build_runtime.py --output packages/typescript/runtime/linux-x64
      - name: Build and pack the TypeScript package
        working-directory: packages/typescript
        run: |
          pnpm build
          pnpm pack --pack-destination ../../dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write # dispatch publish-wrapper.yml
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
      - name: Publish amplifier-agent-ts to npm
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-wrapper.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$GITHUB_REF_NAME"
