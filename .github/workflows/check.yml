name: Check

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-node@54337e0d02de9202d0948aaff36ad556375497b9
        with:
          node-version: "22.23.2"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@c84232ca4fde9b022e20a930bfbbecd386b56fdf
        with:
          version: "0.12.9"
          python-version: "3.12.14"
          cache-dependency-glob: uv.lock
      - name: Check every site carries one release version
        run: python3 scripts/release_version.py check
      - name: Install locked dependencies
        run: |
          npm install --global npm@12.0.2
          npm install --global pnpm@11.25.0
          uv sync --frozen --all-packages --group build
          (cd packages/typescript && pnpm install --frozen-lockfile)
      - name: Lint, format and type check
        run: |
          uv tool install prek==0.3.2
          # setup-uv exports UV_PYTHON for the root; evaluations/ is a separate project on Python 3.13.
          env -u UV_PYTHON prek run --all-files --show-diff-on-failure
      - name: Lint, type check and test both bindings and the HTTP face
        run: uv run --frozen --all-packages --no-sync python scripts/check.py --runtime
      - name: Build source and wheel distributions
        run: uv build --all-packages --no-sources
