[tool.uv.workspace]
members = ["packages/python", "packages/engine", "packages/http"]

[tool.uv.sources]
amplifier-agent = { workspace = true }
amplifier-agent-engine = { workspace = true }
amplifier-agent-http = { workspace = true }

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "openai>=2,<3",
  "packaging>=26.3,<27",
  "pytest>=9,<10",
  "pytest-asyncio>=1,<2",
  "pytest-xdist>=3.8,<4",
  "ruff>=0.16,<1",
  "ty>=0.0.79,<1",
]
build = [
  "pyinstaller>=6.16,<7",
]

[tool.pytest.ini_options]
testpaths = [
  "packages/python/tests",
  "packages/engine/tests",
  "packages/http/tests",
  "conformance/tests",
  "tests/integration",
  "tests/e2e/python",
  "tests/e2e/http",
  "tests/e2e/test_local_forge.py",
]
asyncio_mode = "auto"
addopts = "--import-mode=importlib -n auto"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".amplifier", "evaluations"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "RUF",  # ruff
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "ISC",  # flake8-implicit-str-concat
    "PIE",  # flake8-pie
    "PT",   # flake-pytest-style
    "PTH",  # flake8-use-pathlib
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
]
ignore = [
    "E501",   # line-too-long (formatter makes best-effort attempt)
    # The following rules conflict with the formatter, see: https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",   # tab-indentation
    "E111",   # indentation-with-invalid-multiple
    "E114",   # indentation-with-invalid-multiple-comment
    "E117",   # over-indented
    "ISC002", # multi-line-implicit-string-concatenation
]

[tool.ruff.lint.per-file-ignores]
# The kit's fixtures replace engine attributes with test doubles on purpose; direct assignment is
# rejected by ty because the doubles carry a different type.
"conformance/fixtures/*" = ["B010"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
split-on-trailing-comma = false

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = [".amplifier", "evaluations", "packages/typescript", "build", "dist"]
# PEP 723 scripts declare their own dependencies and run outside the workspace environment.
exclude-scripts = true
