            sessions: [{at: 7, span: 3, id: 3f0a8c21}, {at: 16, span: 3, id: c6244ab2}, [29, 2],
              {at: 36, span: 2, id: ce38884e}, [51, 2], [55, 2], {at: 69, span: 3, id: 4997dbbc}, [77, 2], [88, 3]]
