    title: Built with Amplifier Agent.
    # face is the way in that the project uses: Python, TypeScript, HTTP, or ACP.
    # The picture of a slide is one of three. image is a file in site/assets, 16 wide and 10 high, with its alt.
    # tool is a key in the theme's family.json. drawing is two boxes and the label on the arrow between them.
    projects:
      - name: muxplex
        text: A web dashboard for tmux sessions.
        face: Python
        url: https://github.com/bkrabach/muxplex
        image: built-with-muxplex.webp
        alt: The muxplex logo
      - name: Amplifier for opencode
        text: Makes Amplifier Agent the agent inside opencode.
        face: HTTP
        url: https://github.com/microsoft/amplifier-app-opencode
        drawing:
          from: {name: opencode, text: the interface}
          link: HTTP
          to: {name: Amplifier Agent, text: runs the whole turn}
      - name: Reality Check
        text: Tests your app by using it.
        face: Python
        url: https://github.com/microsoft/amplifier-smart-tool-reality-check
