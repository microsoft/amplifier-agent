            sessions: [[3, 2], [8, 2], {at: 12, span: 3, id: b71d9855}, [18, 2], [24, 2], [31, 2], [36, 3], [41, 2],
              {at: 48, span: 2, id: 89dbe2f0}, [54, 2], [60, 2], {at: 65, span: 3, id: cd6e78e7}, [71, 3], [76, 3],
