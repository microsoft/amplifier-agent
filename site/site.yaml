  # What a Smart Tool is, and what it does for Amplifier Agent.
  - kind: smart-tools
    id: smart-tools
    title: Smart Tools, built in.
    text: >-
      Smart tools are self-contained tools with their own AI capability built in. 
      They are how you can extend amplifier-agent with additional functionality and intelligence.
    # The drawing of who calls a tool, what the tool holds, and what comes back. Each row is a bold name and the small
    # text after it. icon is one of the theme's icons.
    diagram:
      # Left box.
      host:
        title: Amplifier Agent
        rows:
          - name: Agent
            text: gives the tool its task
            icon: spark
          - name: Catalog
            text: lists tools the agent can find and install
            icon: search
          - name: Create
            text: packages what you know as a new tool
            icon: plus
      # Label on the arrow from the left box to the middle box.
      intent: intent
      # Middle box.
      tool:
        title: Smart tool
        row:
          name: CLI and library
          text: optional MCP server, MCP App, etc
        # Gold label inside the middle box, and the four parts under it.
        core: Smart capability, built in
        parts: [Harness, Model, Tools, Skills]
      # Label on the arrow from the middle box to the right box.
      result: result
      # Right box.
      caller:
        title: Back to Amplifier Agent
        rows:
          - name: Result
            text: only the answer returns
          - name: Clear context
            text: the work stays in the tool
      # Line under the three boxes.
      footer: Evaluated once. The same on every host.
    links:
      - label: Browse the catalog
        url: https://microsoft.github.io/amplifier-smart-tools-catalog/
      - label: What a Smart Tool is
        url: https://microsoft.github.io/amplifier-smart-tools/

  # One long task from the agent's side, then how its delegation is set. at, start, and end are percentages of the run.
  - kind: long-run
    id: long-work
    title: Built for the long run.
    text: A long task can run for hours, and you have the confidence that it will succeed without using all your budget.
    # Each moment is a numbered pin on the run and a note under it. One note shows at a time. at can be a list.
    moments:
      - at: 0
        time: Start
        title: It starts on the model you chose.
        text: That model does the primary work. It is never swapped for another model.
      - at: 12
        time: 0 h 45 min
        title: The provider limits requests.
        text: The agent retries a transient failure with backoff.
      - at: 44
        time: 2 h 44 min
        title: The context window fills.
        text: The agent compacts the history that it sends to the model.
      - at: 60
        time: 3 h 43 min
        title: The process restarts between turns.
        text: The session is durable. A new process continues from the transcript alone.
    delegation:
      title: You set the limits. The agent routes inside them.
      text: The agent decides when to delegate.
      # One tab each. file is the file or language of the sample.
      settings:
        - label: The model
          text: >-
             Delegated work goes to another model only when its price is verified lower, in the same provider.
          file: Python
          code: |
            AgentOptions(
                provider="azure-openai",
                model="gpt-6.2-sol",
                skills=["support-review"],
            )
        - label: A specialist
          text: >-
            A specialist is a file: its own instructions, a selection of your tools, and a model at or below
            yours.
          file: support-review/agents/sorter.md
          code: |
            ---
            meta:
              name: sorter
            tools: [read_tickets, search_docs]
            model_role: economy
            ---
            Sort the tickets of one quarter by their cause.
        - label: A local model
          text: A local model is a provider. A turn uses one provider, and its sub-agents use it too.
          file: Python
          code: |
            AgentOptions(
                provider="ollama",
                model=local_model,
            )
    links:
      - label: Models and selection
        path: docs/concepts/models.md
      - label: Built-in agents
        path: docs/concepts/skills.md#named-agents
    # The drawing of the run. The words of the page are above.
    run:
      title: Reviewing a year of support tickets
      aside: 6 h 12 min
      # The colors of the bars.
      legend:
        named: The model you named
        economy: A cheaper model
      # A span with a label is a turn. rows is the number of bars a lane stacks, and row is the place of one bar.
      lanes:
        - name: Turns
          spans:
            - {start: 0, end: 59.4, tone: turn, label: Turn 1}
            - {start: 60.6, end: 100, tone: turn, label: Turn 2}
        - name: Agent
          spans:
            - {start: 0, end: 59.4, tone: named}
            - {start: 60.6, end: 100, tone: named}
        - name: Sub-agents
          text: four at a time
          rows: 4
          spans:
            - {start: 4, end: 58, tone: economy, row: 0}
            - {start: 4, end: 37, tone: economy, row: 1}
            - {start: 4, end: 41, tone: economy, row: 2}
            - {start: 4, end: 26, tone: economy, row: 3}
            - {start: 62, end: 92, tone: named, row: 0}
        # points are [at, percent full]. limit is the percent where the agent compacts.
        - name: Context
          text: how full the window is
          level:
            limit: 80
            label: 80% of the budget
            text: The context fills to 80% of its budget two times. Each time the agent compacts it and continues.
            points: [[0, 4], [12, 30], [27, 55], [44, 80], [44, 32], [60, 56], [81, 80], [81, 36], [100, 58]]
      # The scale under the lanes.
      ticks:
        - {at: 0, label: 0 h}
        - {at: 16.13, label: 1 h}
        - {at: 32.26, label: 2 h}
        - {at: 48.39, label: 3 h}
        - {at: 64.52, label: 4 h}
        - {at: 80.65, label: 5 h}
        - {at: 96.77, label: 6 h}

  # How the agent is held to its contracts, one tab each: a short column beside a drawing. Each part has a kind.
  - kind: evaluations
    id: evaluations
    title: Evaluated for Quality.
    text: No feature is done until a real model passes an evaluation task.
    parts:
      # The order a feature goes through. A station with own is the one this section is about.
      - kind: path
        label: Method
        title: Built with Converge.
        text: >-
          Agree on a vision, write the promises as contracts, and call work done only when evidence
          supports it.
        link:
          label: Watch the Converge videos
          url: https://microsoft.github.io/amplifier-converge/
        stations:
          - name: Vision
            path: contracts/VISION.md
            text: Does it fit the project?
          - name: Contract
            path: contracts
            text: Which clause permits it?
          - name: Docs
            path: docs
            text: Every description changes with it.
          - name: Evaluation
            path: evaluations
            text: A real model passes a task.
            own: true
          - name: Tests
            path: tests
            text: Quickly verifies the feature.

      # One evaluation task, from its file to its grade.
      - kind: trial
        label: Product evaluations
        title: Every feature has a task.
        text: >-
          A real model does the task in an isolated container. Then a separate agent grades the result
          against a rubric.
        link:
          label: Read the tasks
          path: evaluations/tasks
        # The bar at the top of the drawing.
        name: evaluations/tasks/core/resume
        place: One trial
        task:
          title: The task
          aside: task.yaml
          # The label on the code, then lines of the task file as they are.
          excerpt: Turns
          code: |
            turns:
              - user: "Remember this and reply only with OK: the launch code is {{nonce}}."
              - restart: true
              - user: "What is the launch code? Reply with only the code."
                reasoning_effort: low
        # Who works, in order. start and end are percentages of the trial, not measured time.
        # tone is named for the agent under test, or economy for the grader.
        run:
          title: The trial
          aside: Isolated container
          legend:
            named: The agent under test
            economy: The grader
          lanes:
            - name: Process 1
              text: is told the code
              spans:
                - {start: 0, end: 30, tone: named}
            - name: Process 2
              text: resumes the session
              spans:
                - {start: 37, end: 67, tone: named}
              marks:
                - {at: 33.5, label: Restart}
            - name: Grader
              text: scores the rubric
              spans:
                - {start: 72, end: 100, tone: economy}
        # The criteria of the rubric.
        grade:
          title: The grade
          aside: grader.yaml
          criteria:
            - The restart was a real new process.
            - The second turn resumed the session.
            - The model remembered the code.
            - The history was saved to disk.
            - Both turns ended cleanly.
            - Each turn ran at the reasoning effort it asked for.

      # One task run by several agents. A row with own is Amplifier Agent. icon is one of the card icons.
      - kind: matrix
        label: Comparisons
        title: The same task, through other agent harnesses.
        text: The tasks are our own and from public benchmarks.
        link:
          label: Open the comparison harness
          path: .amplifier/evaluation
        given:
          title: One task
          rows:
            - {name: Scenario, icon: chat}
            - {name: Workspace, icon: box}
            - {name: Grader, icon: check}
        agents:
          title: Each agent, alone
          note: Same model, isolated environment
          rows:
            - {name: Amplifier Agent, icon: spark, own: true}
            - {name: Amplifier Agent in another harness, icon: plug}
            - {name: Other agent harnesses, icon: terminal}
        recorded:
          title: Recorded for each trial
          rows:
            - name: Quality
            - name: Cost
            - name: Tokens
            - name: Time
            - name: Trajectory

  # The parts a reader expects: links that make the integration easy, beside a drawing of what connects to the
  # agent, one slide each. A path is a file in the repository.
  - kind: included
    id: included
    title: And the parts you expect.
    integrate:
      title: Easy to integrate
      rows:
        - name: Integration skill
          text: Teaches your coding agent the library.
          path: skills/amplifier-agent/SKILL.md
        - name: Errors that name the fix
          text: Each error has a code, a message, and a remedy that says what to do.
          path: docs/concepts/errors.md
        - name: One contract
          text: Every surface is built from one set of written contracts.
          path: contracts/README.md
        - name: Examples
          text: Applications that use only the public API.
          url: https://github.com/microsoft/amplifier-agent/tree/main/examples
      license:
        name: MIT licensed
        path: LICENSE
    # The drawing: Amplifier Agent on the left, with a line to each row of parts. The parts fill the rows from left to
    # right, in at most four rows. The slides change by themselves, and the buttons under the drawing change them too.
    # label is what a screen reader calls it.
    diagram:
      label: What connects to Amplifier Agent
      middle: Amplifier Agent
      slides:
        - title: Surfaces
          text: Use it from your stack.
          parts:
            - name: Python
              path: docs/python/quickstart.md
            - name: TypeScript
              path: docs/typescript/quickstart.md
            - name: HTTP
              path: docs/http/quickstart.md
            - name: ACP
              path: docs/acp/quickstart.md
        - title: Skills and MCP
          text: Give the agent your functions, MCP servers, skills, and Smart Tools.
          parts:
            - name: Your functions
              path: docs/concepts/tools.md
            - name: Skills
              path: docs/concepts/skills.md
            - name: MCP servers
              path: docs/concepts/tools.md#mcp-servers
            - name: Smart Tools
              path: docs/concepts/smart-tools.md
        - title: Any model
          text: Nine providers, by API key, subscription, or local model.
          link:
            label: Providers
            path: docs/providers.md
          parts:
            - name: Chat Completions
            - name: Azure OpenAI
            - name: Gemini
            - name: ChatGPT
            - name: Ollama
            - name: vLLM
            - name: Anthropic
            - name: OpenAI
            - name: GitHub Copilot

  # Projects that use Amplifier Agent, one slide each, the strongest first. Numbered steps on a dark band close it.
