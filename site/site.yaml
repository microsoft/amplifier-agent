# The content of the Amplifier Agent website. The version comes from packages/python/pyproject.toml.
name: Amplifier Agent
repository: https://github.com/microsoft/amplifier-agent
# Browser tab and search engines.
title: Amplifier Agent | Bring AI into your product
description: >-
  Amplifier Agent handles the agentic engineering, so you focus on the experience.

# The large headline. Each entry is one line.
promise:
  - Bring AI into
  - your product.
# The sentence under the headline.
standfirst: >-
  Amplifier Agent handles the agentic engineering, so you focus on the experience.
# Beside the version, under the name.
facts: Python, TypeScript, HTTP, ACP
# The site's color. It tints the parts that are the agent's own.
tint: '#f7c9a3'

# Header, footer, and phone menu. A path is a file in the repository.
navigation:
  - label: Examples
    url: https://github.com/microsoft/amplifier-agent/tree/main/examples
  - label: GitHub
    url: https://github.com/microsoft/amplifier-agent
# Links beside the GitHub button.
links:
  - label: See the examples
    url: https://github.com/microsoft/amplifier-agent/tree/main/examples

# The label above the prompt box.
prompt_title: Teach your agent how to integrate it
# The prompt box at the right of the headline.
prompt: Install the Amplifier Agent skill from https://github.com/microsoft/amplifier-agent.
# The list under the prompt box. Each entry has a copy button.
requests:
  title: Then ask
  items:
    - I'm building [describe your application]. Use Amplifier Agent as its intelligence layer.
    - Use amplifier-agent to build me a personal assistant that uses the local models on my machine to manage my email.
    - Add an assistant to my app with Amplifier Agent that uses our document store.

# The parts of the page under the headline, in order. Each has a kind.
sections:
  # Videos, one at a time. label names the videos for a screen reader. file, poster, and captions are in site/assets.
  # alt tells a screen reader what the video shows.
  - kind: videos
    id: examples
    label: Amplifier Agent videos
    videos:
      - title: An agent inside your product
        file: amplifier-agent.mp4
        poster: amplifier-agent-poster.webp
        captions: amplifier-agent.en.vtt
        alt: >-
          How an app hands Amplifier Agent a task. A football app scouts the next opponent for hours, on the model
          you choose, and keeps a record of what it did.
      - title: Smart Tools your team shares
        file: amplifier-agent-team.mp4
        poster: amplifier-agent-team-poster.webp
        captions: amplifier-agent-team.en.vtt
        alt: >-
          How a team uses Amplifier Agent. Sessions go to a shared graph, work becomes a Smart Tool, and the team
          shares its tools on one shelf.

  # Questions about recorded sessions, one tab each: the sessions an answer reads, and the answer.
  - kind: recall
    id: context-intelligence
    title: Context Intelligence, built in.
    text: Sessions are stored in a (shared) graph, so you and your team can learn from previous work.
    # store is a key of stores. reads are the ids of the sessions the answer reads. window is a stretch of time in
    # percent, and the answer reads each session in it. Each point names a session, or a list of sessions, and has the
    # number that is on them.
    # motion is how the drawing plays. follow: the row of the sessions read stands out, and a head moves along it
    # from left to right. Each session lights as the head reaches it, and a line joins them. tally: the sessions in the
    # window light up together, then the sessions with a number pop in the order of their numbers. rewind: a head moves
    # back from today across the window, and each session lights as the head passes it.
    questions:
      - label: How a teammate did it
        store: team
        motion: follow
        text: How does Harris apply evaluations to his project, and how can I do that here?
        reads: [2ecb4902, 9501bdc9, a0c8e911, 80705bc6, 0677af28]
        answer: Harris runs a small set of evaluations on each change, and the full set each night.
        points:
          - session: [2ecb4902, 9501bdc9]
            text: He keeps 30 real tasks in the repository, each with a rule that decides a pass.
          - session: [a0c8e911, 80705bc6]
            text: On each change, the agent runs 5 quick tasks first. The full set runs each night.
      - label: How the team works
        store: product
        motion: tally
        text: How is the team using my product? Are there any pain points you see?
        window: {start: 0, end: 100, label: Last two weeks}
        answer: 5 people used it in 64 sessions in the last two weeks.
        points:
          - session: [c6244ab2, 4997dbbc, b71d9855, 89dbe2f0, 1a1920b1, 866ee31c, bd9f67e1, 7a1c1001, 792a4c0a,
              a515d583, 2052b2f6]
            text: In 11 sessions, people asked the agent how to set up the local database.
          - session: [ce38884e, cd6e78e7, f8da2294, 8c281912]
            text: Deploys from the CLI timed out on large projects. 4 people had to run them again.
      - label: Your own history
        store: mine
        motion: rewind
        text: Can you look through my sessions from the last week and see if you have any suggestions on how I can
          improve my workflow?
        window: {start: 50, end: 100, label: Last week}
        answer: You ran 23 sessions last week. Two things look like they are costing you time.
        points:
          - session: [6a7e35e6, 7e89c82b, 9510d0a5, b768f366, ff1ef497, 166c7fff]
            text: In 6 sessions, you pasted the same setup steps. Put them in AGENTS.md.
          - session: [de53b30b, ef04c86f]
            text: You have a lot of tools that are taking up space, consider removing these...
    # The link under the questions.
    link:
      label: Learn how to set up Context Intelligence for a team
      url: https://github.com/microsoft/amplifier-context-intelligence
    # The drawing: its labels, then where each session sits. The words of the page are above.
    # What a screen reader calls the list of questions.
    ask: Ask how the work was done
    # Words in the drawing: what a mark is, the count of marks read, the title of the answer, and the time under the
    # rows.
    unit: sessions
    read: read
    answer: Answer
    axis: [Two weeks ago, Last week, Today]
    # Where sessions are kept. A session is [start, length] in percent of the time shown. One that the answer reads
    # by name, or that a point names, has an id.
    stores:
      team:
        title: Sessions from your team, on the team server
        rows_label: people
        rows:
          - name: Harris
            sessions: [{at: 6, span: 3, id: 2ecb4902}, [13, 2], {at: 24, span: 3, id: 9501bdc9}, [33, 2],
              {at: 45, span: 3, id: a0c8e911}, [53, 2], {at: 67, span: 3, id: 80705bc6}, [76, 2],
              {at: 87, span: 3, id: 0677af28}, [95, 2]]
